spring:
  application:
    name: deal-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:groupdeal_deals}
    username: ${DB_USER:groupdeal}
    password: ${DB_PASSWORD:groupdeal}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate auto-DDL
    open-in-view: false    # avoid the lazy-loading-in-controller footgun
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# --- GroupDeal-specific config ---
groupdeal:
  clients:
    catalog:
      stub: true            # flip to false once Catalog Service exists (see CatalogClient)
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    inventory:
      stub: true            # flip to false once Inventory Service exists (see InventoryClient)
      base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

resilience4j:
  circuitbreaker:
    instances:
      catalogService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      inventoryService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    instances:
      catalogService:
        timeout-duration: 3s
      inventoryService:
        timeout-duration: 3s
